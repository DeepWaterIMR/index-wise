# config.yaml — the single source of truth for this index project.
# scaffold.R stamps the identity fields (SPECIES_*) into document titles/paths; every other
# field is read at run time by R/0_setup.R and used by the documents. Edit here, not in the
# qmds.

# --- Identity ---------------------------------------------------------------------------
SPECIES_NAME:  "{{SPECIES_NAME}}"     # display name, e.g. "Beaked redfish"
SPECIES_SLUG:  "{{SPECIES_SLUG}}"     # kebab-case slug for folders/files, e.g. "snabeluer"
SPECIES_LATIN: "{{SPECIES_LATIN}}"    # binomial, e.g. "Sebastes mentella"
STOCK_SLUG:    "{{STOCK_SLUG}}"       # file prefix of the docs/data documents; default SPECIES_SLUG
STOCK_CODE:    null                   # ICES stock code, e.g. "reb.27.1-2"
AREA_LABEL:    "{{AREA_LABEL}}"       # area in document titles, e.g. "ICES 1–2" or "N62"
PURPOSE: null                         # one sentence: why the index is made (benchmark, assessment)

# Human metadata uses wise-writing's AUTHORS/AFFILIATIONS schema.
# Supply accountable human names and matching affiliation IDs before scaffolding.
AUTHORS: []
AFFILIATIONS: []
BASE_SIZE: 12
FIGURES_DIR: "figures"
DOCS_DIR: "docs"                      # root of the document folders (assets, background, data, sdmtmb); "docs/benchmark" for an index made for a stock-assessment benchmark (later rounds: e.g. "docs/assessment-2027")

# --- Data selection ---------------------------------------------------------------------
FILTER_SP:                            # Norwegian commonname value(s) (confirm via BAIT taxaindex)
  - "snabeluer"
SURVEYS:                              # cruise-series labels (groups of surveys) to include
  - "EcoS"
  - "WinterS"
  - "EggaN"
USE_SPD: false                        # legacy SPD files? true for northern/offshore; false for southern/coastal
INCLUDE_RUSSIAN: true                 # Russian data included by DEFAULT; set false to exclude
FIRST_YEAR: 1981                      # earliest year to include
LAST_YEAR: null                       # last year to include; null = the year before the current year
MAX_COLLECT_ROWS: 2000000              # stop before collecting more candidate stations than this
LENGTH_LIMITS: [5, 200]               # plausible length range (cm); length records outside are removed
FISHABLE_GEAR: "Hooks"                # Biotic gear category of the commercial catches used for the fishable length (docs/background)
LW_OUTLIER_SD: 4                      # length-weight records with |standardised residual| above this are outliers
TOW_SPEED_LIMITS: [1.5, 6]            # plausible tow speed (knots); outside: duration set to NA, distance kept
POSITION_ERROR_DEPTH: 1500            # hauls positioned deeper than this on GEBCO (m) ...
POSITION_ERROR_RATIO: 3               # ... with recorded depth < GEBCO / ratio (or missing) have a wrong position and are removed
CRUISE_SERIES_LABELS: null
SURVEY_NAMES: null                    # optional names of surveys without a cruise-series code, keyed by cruise number            # optional map code -> label; defaults in R/compile_functions.R
# Documented cruise exclusions. Use only when no general filtering rule removes an anomaly
# (knowledge/influence-diagnostics.md). Cruise numbers are reused by vessels: name both.
EXCLUDE_CRUISES: []
#  - platformname: "<vessel name>"
#    cruise: "<cruise number>"
#    reason: "<one line, with a pointer to the influence section>"

# --- Response & products ----------------------------------------------------------------
RESPONSE: "biomass"                   # "biomass" (rho_biomass) or "abundance" (rho_abundance)
OVER_CM: 30                           # threshold for the "over-X-cm biomass" product
LENGTH_GROUPS: ["(0,10]", "(10,15]", "(15,20]", "(20,25]", "(25,30]", "(30,40]", "(40,Inf]"]

# --- Gear width -------------------------------------------------------------------------
# A single number uses one effective width for all gears. Keep geartype as a model fixed effect
# when more than one major gear type is represented.
GEAR_WIDTH: 25

# --- Index year (EFFORT is set under Model) ---------------------------------------------
# Month the index year begins (1 = calendar year). With 7, a July-June season is one index
# year, labelled by the calendar year it starts ("start") or ends ("end"). Set this whenever
# surveys from different seasons are combined, and match ASSESSMENT_INDEX_TIMING to it.
INDEX_YEAR_START_MONTH: 1
INDEX_YEAR_LABEL: "start"

# --- Survey integration and catchability ------------------------------------------------
SURVEY_EFFECT: false                  # cruise-series catchability factor (fsurvey) in the model
REFERENCE_SURVEY: null                # prediction reference series; null = most-sampled series
REFERENCE_GEAR: null                  # prediction reference gear type; null = most-sampled gear
REFERENCE_MONTH: null                 # prediction reference month; null = most-sampled month
CATCHABILITY_TERMS: []                # e.g. ["hour"] or ["sun_altitude"] for diel catchability
CATCHABILITY_REFERENCE: {}            # e.g. {hour: 12}; a term without a value uses the median

# --- Spatial domain & mesh --------------------------------------------------------------
REGION: "ALL"                         # feature/layer name used by a multi-region project
REGION_SLUG: "all"                    # filename-safe region identifier, e.g. N62 or S62
REGION_FILE: "data/source/prediction_region.gpkg"
REGION_LAYER: "prediction_region"
PREDICTION_REGION_FILE: null          # built by docs/data/<stock>-3-data.qmd; default data/source/<stock>-prediction-region.gpkg
REGION_BUFFER_KM: 50                  # buffer around the hull of positive hauls (prediction region); large enough to merge isolated hauls
REGION_CONCAVITY: 0.1                 # sf::st_concave_hull ratio for the prediction region
# Stock area for survey selection: ICES subareas (tested on the icesarea code) or, when
# empty, the REGION_FILE polygon (ACQUISITION_REGION_LAYER if set).
STOCK_SUBAREAS: []                    # e.g. ["1", "2"]
ICES_AREAS_FILE: "data/source/ICES_Areas/ICES_Areas_20211101.shp"  # needed with STOCK_SUBAREAS
MAP_LIMITS: [-15, 60, 57, 81]         # lon/lat limits of the overview map in the survey-selection document
# Optional broader acquisition polygon and station partition. A Step 1 document can set
# ACQUISITION_REGION to a reporting feature (for example NS) while retaining REGION as the
# later model domain (for example S62), then set ADD_REGION_IDENTIFIER to true.
ACQUISITION_REGION: null
ACQUISITION_REGION_LAYER: null
PARTITION_REGION: null
PARTITION_REGION_LAYER: null
ADD_REGION_IDENTIFIER: false
CRS: 32633                            # projected CRS (EPSG); 32633 = UTM 33N
MAP_CRS: null                          # optional map display CRS; defaults to Arctic LAEA (EPSG:3995)
MAP_SHAPEFILES: null                   # optional ggOceanMaps shapefile set; defaults to Arctic
GRID_KM: 10                           # prediction grid cell size (km)
MESH_CUTOFF_KM: 60                    # make_mesh cutoff (km)
BARRIER: false                        # add a land barrier mesh?
MAX_DEPTH: 1400                       # deepest grid cell to keep (m)
MIN_DEPTH: null                       # shallowest grid cell to keep (m); null = no minimum

# --- Model ------------------------------------------------------------------------------
# EFFORT: "density" models swept-area density; "offset" models raw catch with a log swept-area
# offset. Under a standard delta-lognormal/gamma the two are the same model (log-likelihoods
# differ by a constant Jacobian, so never compare their AICs); under Tweedie they differ. The
# offset reaches the occurrence component only in a Poisson-link delta family.
EFFORT: "density"                     # density | offset
FAMILY: "delta_lognormal"             # delta_lognormal | delta_gamma | delta_lognormal_poisson_link | delta_gamma_poisson_link | tweedie
SPATIAL: "on"                         # one value, or one per delta component, e.g. ["on", "off"]
SPATIOTEMPORAL: "ar1"                 # ar1 | iid | rw | off
YEAR_EFFECT: false                    # year factor (fyear) in the Step 2 model; true for a SPiCT-type base (IID + year)
INCLUDE_MONTH: true                   # month smooth; switch off if it collapses (uneven seasons)
INCLUDE_TEMPERATURE: false            # temperature smooth is OFF by default
ASSESSMENT_MODEL: "SPiCT"             # what consumes the selected index
SELECTED_INDEX: "Total biomass"       # exact name in the report's index_products list
ASSESSMENT_INDEX_UNITS: "relative index units"
ASSESSMENT_INDEX_TYPE: "survey biomass"
ASSESSMENT_INDEX_TIMING: 0.5          # fraction of the INDEX year; confirm against survey timing
N_WORKERS: 1                          # parallel refits (influence, survey comparison); forked on macOS/Linux
INFLUENCE_REGION_COL: null            # optional grid column for index_by_region() in the influence section

# --- Late data, bridging and robustness -------------------------------------------------
# Data that usually arrive after the assessment (e.g. one nation's or vessel's hauls), as a
# compiled-data column and its values: {column: "nation", values: ["90"]}. null = none known.
LATE_COMPONENTS: null
PREVIOUS_INDEX_FILE: null             # last assessment's published index (csv/rds: year, est)
REVISION_TOLERANCE: 0.2               # flag years whose rescaled index moved more than this
ROBUSTNESS:
  subsample_props: [0.5, 0.75, 0.9]   # share of stations kept per year
  subsample_reps: 5                   # replicates per share
  start_year_peels: 3                 # drop the first 1..n years
  downweight_years: []                # years with a known problem, down-weighted as a sensitivity
  downweight_value: 0.1

# --- Commercial CPUE (optional; docs/sdmtmb/cpue, knowledge/cpue.md) -----------------
# Logbook and landings extracts are local, confidential and git-ignored (data/source/cpue/).
CPUE:
  file: "data/source/cpue/logbook_records.rds"  # one row per record, mapped to the schema in cpue.qmd
  landings_file: null                 # landings per year (year, landed) for the reconciliation
  source: "ERS"                       # ERS | aggregated logbooks | sales notes
  unit: "haul"                        # haul | day | trip — one unit per index
  first_year: null                    # null = first year in the data
  ranges:                             # plausible ranges [min, max]; null = open
    catch: [0, null]
    effort: [0, null]
  min_years_active: 3                 # core fleet: years a vessel fished
  min_records_year: 0                 # records of a vessel within a year
  min_records_total: 100              # records of a vessel in total
  effort_treatment: "covariate"       # covariate (estimated slope) | offset (catch proportional to effort)
  engine: "sdmTMB"                    # glmmTMB | mgcv | sdmTMB
  spatiotemporal: "iid"               # sdmTMB: off | iid | ar1
  mesh_cutoff_km: 10
  grid_km: 5                          # prediction grid over the fished domain
  reference: {}                       # prediction reference, e.g. {log_effort: 5.5, yday_std: -1}
  final_month: null                   # month the terminal-year data end (final-month retrospective)
  bootstrap_n: 200

# --- Paths (relative to project root) ---------------------------------------------------
OUTPUT_DIR: "data/output"
REVIEW_DIR: "ai/review"
SOURCE_DIR: "data/source"
