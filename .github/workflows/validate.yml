name: Validate portable project contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: index-wise
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DeepWaterIMR/wise-writing
          path: wise-writing
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DeepWaterIMR/spict-wise
          path: spict-wise
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          packages: |
            any::yaml
            any::jsonlite
            any::dplyr
            any::knitr
      - name: Validate synthetic handoff and scaffold
        working-directory: index-wise
        env:
          SPICT_ACADEMIC_WRITING: ${{ github.workspace }}/wise-writing
        run: |
          Rscript config/test-assessment-index-handoff.R
          Rscript config/test-index-helpers.R
          Rscript config/test-cpue-helpers.R
          Rscript config/validate-scaffold.R
